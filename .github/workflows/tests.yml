name: Tests

# Runs the full pytest suite. No secrets, no network-dependent tests and no
# deploy step: deploying is render-deploy.yml's job alone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 3.11 = production (Dockerfile python:3.11-slim)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mcp.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mcp.txt pytest==9.1.1
      - name: Run tests
        run: python -m pytest -q
