[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-sentiment-x402-mcp"
version = "0.2.0"
description = "Crypto news sentiment MCP server: bullish/bearish/neutral label, score and the headlines behind it for 24 coins, paid per call in USDC on Base via x402. Use when an agent needs current or hourly news sentiment for a crypto ticker."
readme = "MCP.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE-MCP"]
authors = [{ name = "whatevercat-creator" }]
keywords = ["mcp", "x402", "crypto", "sentiment", "agents"]
dependencies = [
    "mcp>=2.2.0,<3",
    "cdp-sdk",
    "x402[httpx]>=2.25.0",
    "httpx",
    "pydantic>=2",
    "certifi>=2026.10.19",
]

[project.urls]
Repository = "https://github.com/whatevercat-creator/crypto-sentiment-x402"
Homepage = "https://github.com/whatevercat-creator/crypto-sentiment-x402"

[project.scripts]
crypto-sentiment-x402-mcp = "crypto_sentiment_x402_mcp:main"

[tool.setuptools.packages.find]
include = ["crypto_sentiment_x402_mcp*"]
